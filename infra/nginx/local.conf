server {
  listen 80;
  server_name localhost;

  # Compatibility path used by the current Supabase JS query client.
  # This bridge is intentionally loopback-only via docker-compose.local.yml.
  location /rest/v1/ {
    proxy_set_header Authorization "";
    proxy_set_header apikey "";
    proxy_set_header Host $host;
    proxy_pass http://rest:3000/;
  }

  location = /rest/v1 {
    return 308 /rest/v1/;
  }

  location / {
    proxy_set_header Authorization "";
    proxy_set_header apikey "";
    proxy_set_header Host $host;
    proxy_pass http://rest:3000/;
  }
}
