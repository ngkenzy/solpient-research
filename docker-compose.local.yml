name: solpient-local

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SOLPIENT_DB_USER:-solpient}
      POSTGRES_PASSWORD: ${SOLPIENT_DB_PASSWORD:-solpient_local_change_me}
      POSTGRES_DB: ${SOLPIENT_DB_NAME:-solpient}
    ports:
      - "127.0.0.1:${SOLPIENT_DB_PORT:-5432}:5432"
    volumes:
      - solpient_postgres:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SOLPIENT_DB_USER:-solpient} -d ${SOLPIENT_DB_NAME:-solpient}"]
      interval: 5s
      timeout: 5s
      retries: 20

  rest:
    image: postgrest/postgrest:v16.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://${SOLPIENT_DB_USER:-solpient}:${SOLPIENT_DB_PASSWORD:-solpient_local_change_me}@db:5432/${SOLPIENT_DB_NAME:-solpient}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: solpient_dev_api
      PGRST_DB_POOL: 10
      PGRST_SERVER_PORT: 3000
    expose:
      - "3000"

  gateway:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - rest
    ports:
      - "127.0.0.1:${SOLPIENT_DATA_API_PORT:-54321}:80"
    volumes:
      - ./infra/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  solpient_postgres:
