name: SOLPIENT Evidence Provenance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/evidence-provenance.yml"
  workflow_dispatch:
    inputs:
      ticker:
        description: Optional ticker
        required: false
        type: string
  schedule:
    - cron: "35 10 * * *"
  push:
    branches: [main]
    paths:
      - "lib/evidence-provenance.mjs"
      - "lib/evidence-provenance-db.mjs"
      - "scripts/sync-evidence-provenance.mjs"
      - "supabase/migrations/20260921203000_canonical_evidence_provenance_phase2.sql"
      - ".github/workflows/evidence-provenance.yml"

concurrency:
  group: solpient-evidence-provenance-ops-full-v3
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Test provenance rules
        run: npm run test:provenance
      - name: Synchronize canonical evidence
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COVERAGE_TICKER: ${{ inputs.ticker }}
        run: npm run sync:provenance
