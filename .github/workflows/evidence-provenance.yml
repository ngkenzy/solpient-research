name: SOLPIENT Evidence Provenance

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: Optional ticker
        required: false
        type: string
concurrency:
  group: solpient-provenance-writer
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Test provenance rules
        run: npm run test:provenance
      - name: Synchronize canonical evidence
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COVERAGE_TICKER: ${{ inputs.ticker }}
        run: npm run sync:provenance
