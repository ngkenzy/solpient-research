name: SOLPIENT Clean Start Database

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: solpient-clean-start-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-start:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start fresh local Supabase database
        run: supabase db start

      - name: Replay every migration from zero
        run: supabase db reset --local --no-seed

      - name: Locate local Postgres container
        id: db
        shell: bash
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}' | head -n 1)"
          if [ -z "$DB_CONTAINER" ]; then
            echo "No local Supabase Postgres container found."
            docker ps -a
            exit 1
          fi
          echo "container=$DB_CONTAINER" >> "$GITHUB_OUTPUT"

      - name: Historical integrity integration test
        shell: bash
        run: |
          docker exec -i "${{ steps.db.outputs.container }}"             psql -v ON_ERROR_STOP=1 -U postgres -d postgres             < supabase/tests/historical_integrity.sql

      - name: Evidence provenance integration test
        shell: bash
        run: |
          docker exec -i "${{ steps.db.outputs.container }}"             psql -v ON_ERROR_STOP=1 -U postgres -d postgres             < supabase/tests/evidence_provenance.sql

      - name: Group A research-foundation integration test
        shell: bash
        run: |
          docker exec -i "${{ steps.db.outputs.container }}"             psql -v ON_ERROR_STOP=1 -U postgres -d postgres             < supabase/tests/group_a_research_foundation.sql

      - name: Group B1 auth and portfolio isolation test
        shell: bash
        run: |
          docker exec -i "${{ steps.db.outputs.container }}"             psql -v ON_ERROR_STOP=1 -U postgres -d postgres             < supabase/tests/group_b1_auth_portfolios.sql

      - name: Group B2 portfolio research-state isolation test
        shell: bash
        run: |
          docker exec -i "${{ steps.db.outputs.container }}" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/group_b2_portfolio_research_state.sql

      - name: Group B3 thesis personalization isolation test
        shell: bash
        run: |
          docker exec -i "${{ steps.db.outputs.container }}" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/group_b3_thesis_personalization.sql

      - name: Group B4 company materiality contract test
        shell: bash
        run: |
          docker exec -i "${{ steps.db.outputs.container }}" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/group_b4_company_materiality.sql

      - name: Group B5 What Matters isolation test
        shell: bash
        run: |
          docker exec -i "${{ steps.db.outputs.container }}" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/group_b5_what_matters.sql

      - name: Group B6 feedback isolation test
        shell: bash
        run: |
          docker exec -i "${{ steps.db.outputs.container }}" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/group_b6_feedback.sql

      - name: Group B7 research-demand isolation test
        shell: bash
        run: |
          docker exec -i "${{ steps.db.outputs.container }}" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/group_b7_research_demand.sql

      - name: Group B9 thesis-alert isolation test
        shell: bash
        run: |
          docker exec -i "${{ steps.db.outputs.container }}" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/group_b9_thesis_alerts.sql

      - name: Database lint
        run: supabase db lint --local --level warning --fail-on error

      - name: Show migration status
        if: always()
        run: supabase migration list --local || true

      - name: Stop disposable local stack
        if: always()
        run: supabase stop --no-backup || true
