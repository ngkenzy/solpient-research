name: SEC & Ownership Monitor

on:
  workflow_dispatch:
  schedule:
    # Weekdays. GitHub cron is UTC; source cadence can be changed without schema changes.
    - cron: "15 14,22 * * 1-5"

concurrency:
  group: sec-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check SEC directly
        env:
          SEC_USER_AGENT: "SOLPIENT Research ngkenzy@users.noreply.github.com"
          SEC_CONTACT: "ngkenzy@users.noreply.github.com"
        run: node scripts/monitor-sec.mjs

      - name: Commit verified monitor state and events
        run: |
          if git diff --quiet -- data/monitor/sec-state.json data/monitor/sec-events.json; then
            echo "No verified monitor changes."
            exit 0
          fi

          git config user.name "solpient-monitor"
          git config user.email "70502756+ngkenzy@users.noreply.github.com"
          git add data/monitor/sec-state.json data/monitor/sec-events.json
          git commit -m "Auto-monitor SEC filings"
          git push

      - name: Record authoritative SEC checks and filing events
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync:sec-monitor-state
