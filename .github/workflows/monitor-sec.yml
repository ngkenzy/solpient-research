name: SOLPIENT SEC Auto-Monitor

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/monitor-sec.mjs"
      - "data/monitor/companies.json"
      - "data/monitor/managers.json"
      - ".github/workflows/monitor-sec.yml"

concurrency:
  group: solpient-sec-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check SEC for new filings
        env:
          SEC_USER_AGENT: "SOLPIENT Research ngkenzy@users.noreply.github.com"
        run: node scripts/monitor-sec.mjs

      - name: Commit monitor state and new events
        run: |
          if git diff --quiet -- data/monitor/sec-state.json data/monitor/sec-events.json; then
            echo "No monitor state changes."
            exit 0
          fi

          git config user.name "solpient-monitor"
          git config user.email "70502756+ngkenzy@users.noreply.github.com"
          git add data/monitor/sec-state.json data/monitor/sec-events.json
          git commit -m "Auto-monitor SEC filings"
          git push
