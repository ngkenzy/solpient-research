name: SEC-first Universe Feed V1

on:
  pull_request:
    paths:
      - "lib/universe-feed-sec.mjs"
      - "lib/universe-sector-model-v2.mjs"
      - "lib/universe-sector-model-v2-2.mjs"
      - "lib/universe-sector-model-v2-3.mjs"
      - "scripts/test-universe-sector-model-v2.mjs"
      - "scripts/test-sector-classification-repair-v2-2.mjs"
      - "scripts/test-sector-classification-coverage-v2-3.mjs"
      - "scripts/fixtures/sector-classification-v2-3-audit.json"
      - "scripts/build-sec-universe-fundamentals.mjs"
      - "scripts/enrich-sec-universe-market.mjs"
      - "scripts/test-sec-universe-feed.mjs"
      - "lib/universe-issuer-selection.mjs"
      - "scripts/test-universe-issuer-selection.mjs"
      - "docs/SEC_FIRST_UNIVERSE_FEED.md"
      - ".github/workflows/sec-universe-feed.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test SEC-first feed against live screen contract
        run: node scripts/test-sec-universe-feed.mjs
      - name: Test issuer canonicalization
        run: node scripts/test-universe-issuer-selection.mjs
      - name: Test Sector Model V2
        run: node scripts/test-universe-sector-model-v2.mjs
      - name: Test Sector Classification Repair V2.2
        run: node scripts/test-sector-classification-repair-v2-2.mjs
      - name: Test Sector Classification Coverage V2.3
        run: node scripts/test-sector-classification-coverage-v2-3.mjs
      - name: Audit V2.3 taxonomy coverage
        run: node scripts/audit-sector-classification.mjs --input=scripts/fixtures/sector-classification-v2-3-audit.json --fail-on-obvious-unknown=true --fail-on-unresolved=true
      - name: Syntax check bulk builders
        run: |
          node --check scripts/build-sec-universe-fundamentals.mjs
          node --check scripts/enrich-sec-universe-market.mjs
