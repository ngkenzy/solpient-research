name: Group A Production Gate

on:
  push:
    branches:
      - ops/group-a-production-closeout

concurrency:
  group: group-a-production-gate
  cancel-in-progress: false

jobs:
  close-group-a:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      SUPABASE_DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
      SEC_CONTACT: "ngkenzy@users.noreply.github.com"
      SEC_USER_AGENT: "SOLPIENT Research ngkenzy@users.noreply.github.com"

    steps:
      - name: Check out exact production-gate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify branch is based on production main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          BASE="$(git merge-base HEAD origin/main)"
          MAIN="$(git rev-parse origin/main)"
          if [ "$BASE" != "$MAIN" ]; then
            echo "Closeout branch is not based on current main."
            echo "merge-base=$BASE main=$MAIN"
            exit 1
          fi
          echo "main_sha=$MAIN"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Derive linked project reference
        id: project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_REF="$(node -e 'const u=new URL(process.env.SUPABASE_URL); const ref=u.hostname.split(".")[0]; if(!ref) process.exit(2); process.stdout.write(ref)')"
          echo "project_ref=$PROJECT_REF" >> "$GITHUB_OUTPUT"

      - name: Capture read-only production state before any migration action
        env:
          GROUP_A_PHASE: inspect
          GROUP_A_STATE_OUTPUT: group-a-production-pre.json
        run: node scripts/group-a-production-state.mjs

      - name: Select read-only database inspection path
        id: db
        shell: bash
        run: |
          set -euo pipefail
          direct=""
          source_name=""
          for name in SUPABASE_DB_URL SUPABASE_DATABASE_URL SUPABASE_DIRECT_URL DATABASE_URL POSTGRES_URL_NON_POOLING POSTGRES_URL; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              direct="$value"
              source_name="$name"
              break
            fi
          done

          if [ -n "$direct" ]; then
            echo "::add-mask::$direct"
            echo "GROUP_A_DB_URL=$direct" >> "$GITHUB_ENV"
            echo "mode=db-url" >> "$GITHUB_OUTPUT"
            echo "Using existing direct database URL secret: $source_name"
            exit 0
          fi

          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] && [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "mode=linked" >> "$GITHUB_OUTPUT"
            echo "Using Supabase CLI linked-project credentials."
            exit 0
          fi

          echo "::error::No safe remote database inspection credential path is available."
          echo "::error::Need either a direct Postgres URL secret (SUPABASE_DB_URL, SUPABASE_DATABASE_URL, SUPABASE_DIRECT_URL, DATABASE_URL, POSTGRES_URL_NON_POOLING, or POSTGRES_URL), or both SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD."
          exit 1

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Link production Supabase project when using linked mode
        if: steps.db.outputs.mode == 'linked'
        shell: bash
        run: |
          set -euo pipefail
          supabase link \
            --project-ref "${{ steps.project.outputs.project_ref }}" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Inspect production migration history
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.db.outputs.mode }}" = "db-url" ]; then
            NO_COLOR=1 supabase migration list --db-url "$GROUP_A_DB_URL" | tee migration-list-before.txt
          else
            NO_COLOR=1 supabase migration list --linked -p "$SUPABASE_DB_PASSWORD" | tee migration-list-before.txt
          fi

      - name: Dump live public schema for partial-deployment diagnosis
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.db.outputs.mode }}" = "db-url" ]; then
            supabase db dump --db-url "$GROUP_A_DB_URL" --schema public -f production-public-schema.sql
          else
            supabase db dump --linked -p "$SUPABASE_DB_PASSWORD" --schema public -f production-public-schema.sql
          fi

      - name: Classify partial Group A production schema
        run: node scripts/diagnose-group-a-production-schema.mjs production-public-schema.sql migration-list-before.txt

      - name: Diagnose Group A migration boundary without applying changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, json
          expected=["20260925090000","20260925090100","20260925090200","20260925090300"]
          ansi=re.compile(r"\x1b\[[0-9;]*m")
          rows=[]
          for raw in open("migration-list-before.txt",encoding="utf-8"):
              line=ansi.sub("",raw)
              if "|" not in line:
                  continue
              parts=[p.strip().replace(chr(96),"") for p in line.split("|")]
              if len(parts)<2:
                  continue
              local=parts[0] if re.fullmatch(r"\d{4,14}",parts[0]) else ""
              remote=parts[1] if re.fullmatch(r"\d{4,14}",parts[1]) else ""
              if local or remote:
                  rows.append((local,remote))
          state={
              "group_a": {
                  v: {
                      "local": any(l==v for l,r in rows),
                      "remote": any(r==v for l,r in rows),
                  } for v in expected
              },
              "remote_only":[r for l,r in rows if r and not l],
              "pending_local":[l for l,r in rows if l and not r],
          }
          open("group-a-migration-diagnosis.json","w",encoding="utf-8").write(json.dumps(state,indent=2)+"\n")
          print(json.dumps(state,indent=2))
          PY

          echo "Group A production is known to contain a partial schema footprint."
          echo "This diagnostic workflow intentionally performs NO db push."
          exit 1

      - name: Confirm Group A objects and policy/rule seeds
        env:
          GROUP_A_PHASE: post
          GROUP_A_STATE_OUTPUT: group-a-production-post-migration.json
        run: node scripts/group-a-production-state.mjs

      - name: Run Group A Production Health
        run: npm run check:research-foundation:production

      - name: Prove migration did not mutate historical publications
        run: node scripts/compare-group-a-production-integrity.mjs group-a-production-pre.json group-a-production-post-migration.json

      - name: SEC monitor canary
        run: node scripts/monitor-sec.mjs

      - name: Persist SEC canary into authoritative Group A state
        run: npm run sync:sec-monitor-state

      - name: Run targeted Group A maintenance canary
        env:
          RESEARCH_MAINTENANCE_BATCH_SIZE: "5"
          MARKET_DATA_USER_AGENT: "SOLPIENT Research/1.0"
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sync-market-data.mjs
          npm run sync:research-foundation
          npm run process:research-maintenance

      - name: Re-run Group A Production Health after canaries
        run: npm run check:research-foundation:production

      - name: Capture final production state
        env:
          GROUP_A_PHASE: post
          GROUP_A_STATE_OUTPUT: group-a-production-post-canary.json
        run: node scripts/group-a-production-state.mjs

      - name: Historical-integrity production sanity check
        run: node scripts/compare-group-a-production-integrity.mjs group-a-production-pre.json group-a-production-post-canary.json

      - name: Upload production closeout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: group-a-production-gate-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            group-a-production-*.json
            migration-list-*.txt
            group-a-migration-diagnosis.json
            group-a-schema-diagnosis.json
            production-public-schema.sql
            db-push*.txt
            data/monitor/sec-state.json
            data/monitor/sec-events.json
