name: Autonomous Research Factory V2.1 Production Canary

# Retry marker: valuation evidence policy V2.1.1 production verification.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/autonomous-research-factory-v2-1-canary.yml"
  workflow_dispatch:

concurrency:
  group: solpient-research-factory
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEARCH_FACTORY_TICKER: "MSFT"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: Verify Autonomous Research Factory V2.1
        run: |
          npm run test:research-factory
          npm run test:research-factory:v1.1
          npm run test:research-factory:v2.1

      - name: Open controlled autonomous run
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          import { createClient } from "@supabase/supabase-js";

          const sb=createClient(
            process.env.SUPABASE_URL,
            process.env.SUPABASE_SERVICE_ROLE_KEY,
            {auth:{persistSession:false,autoRefreshToken:false}}
          );

          const {data:factoryRun,error:factoryError}=await sb
            .from("research_factory_runs")
            .select("id")
            .eq("factory_version","research-factory-v1")
            .order("created_at",{ascending:false})
            .limit(1)
            .single();
          if(factoryError)throw factoryError;

          const {data:autoRun,error:autoError}=await sb
            .from("research_factory_autonomous_runs")
            .insert({
              research_factory_run_id:factoryRun.id,
              automation_version:"autonomous-research-factory-v2.1",
              status:"running",
              max_items:1,
              summary:{
                canary:true,
                ticker:"MSFT",
                scope:"industry_assignment_and_valuation_policy"
              }
            })
            .select("id")
            .single();
          if(autoError)throw autoError;

          appendFileSync(
            process.env.GITHUB_ENV,
            "RESEARCH_FACTORY_RUN_ID="+factoryRun.id+"\n"+
            "AUTONOMOUS_FACTORY_RUN_ID="+autoRun.id+"\n"
          );

          console.log(JSON.stringify({
            research_factory_run_id:factoryRun.id,
            autonomous_run_id:autoRun.id,
            ticker:"MSFT"
          },null,2));
          NODE

      - name: Assign industry module
        run: |
          node scripts/assign-research-factory-industry-v2-1.mjs \
            --factory-run-id="$RESEARCH_FACTORY_RUN_ID" \
            --ticker=MSFT \
            --autonomous-run-id="$AUTONOMOUS_FACTORY_RUN_ID"

      - name: Build autonomous valuation
        run: |
          node scripts/build-autonomous-valuation-pack-v2-1.mjs \
            --factory-run-id="$RESEARCH_FACTORY_RUN_ID" \
            --ticker=MSFT \
            --autonomous-run-id="$AUTONOMOUS_FACTORY_RUN_ID"

      - name: Refresh MSFT factory state
        run: |
          node scripts/refresh-research-factory-v1.mjs \
            --factory-run-id="$RESEARCH_FACTORY_RUN_ID" \
            --ticker=MSFT

      - name: Verify and close canary audit trail
        run: |
          node --input-type=module <<'NODE'
          import { createClient } from "@supabase/supabase-js";

          const sb=createClient(
            process.env.SUPABASE_URL,
            process.env.SUPABASE_SERVICE_ROLE_KEY,
            {auth:{persistSession:false,autoRefreshToken:false}}
          );

          const {data:item,error:itemError}=await sb
            .from("research_factory_items")
            .select("id,ticker,stage,status,coverage_pct,company_id")
            .eq("research_factory_run_id",process.env.RESEARCH_FACTORY_RUN_ID)
            .eq("ticker","MSFT")
            .single();
          if(itemError)throw itemError;

          const decisionSelect="autonomous_run_id,decision_type,decision_status,confidence,policy_version,input_hash,decision_hash,created_at";
          const {data:runDecisions,error:runDecisionError}=await sb
            .from("research_factory_autonomous_decisions")
            .select(decisionSelect)
            .eq("autonomous_run_id",process.env.AUTONOMOUS_FACTORY_RUN_ID)
            .eq("research_factory_item_id",item.id)
            .order("created_at",{ascending:true});
          if(runDecisionError)throw runDecisionError;

          const {data:itemDecisions,error:itemDecisionError}=await sb
            .from("research_factory_autonomous_decisions")
            .select(decisionSelect)
            .eq("research_factory_item_id",item.id)
            .order("created_at",{ascending:false})
            .limit(30);
          if(itemDecisionError)throw itemDecisionError;

          const industry=
            (runDecisions??[]).find(x=>x.decision_type==="industry_assignment") ??
            (itemDecisions??[]).find(x=>
              x.decision_type==="industry_assignment" &&
              x.decision_status==="applied" &&
              x.policy_version==="industry-assignment-v2.1"
            );
          const valuation=
            (runDecisions??[]).find(x=>x.decision_type==="valuation_assumptions") ??
            (itemDecisions??[]).find(x=>
              x.decision_type==="valuation_assumptions" &&
              String(x.policy_version??"").startsWith("valuation-assumptions-v2.1")
            );
          if(!industry)throw new Error("Canary could not resolve an applied industry assignment decision.");
          if(!valuation)throw new Error("Canary could not resolve a valuation assumptions decision.");

          const packDecision=
            (runDecisions??[]).find(x=>
              x.decision_type==="valuation_pack" &&
              x.decision_hash===valuation.decision_hash
            ) ??
            (itemDecisions??[]).find(x=>
              x.decision_type==="valuation_pack" &&
              x.decision_hash===valuation.decision_hash
            );

          const autoApproved=valuation.decision_status==="applied"?1:0;
          const quarantined=valuation.decision_status==="quarantined"?1:0;

          let reviewedPack=null;
          if(autoApproved){
            if(!packDecision||packDecision.decision_status!=="applied"){
              throw new Error("Applied valuation did not record an applied valuation-pack decision.");
            }
            const {data,error}=await sb
              .from("candidate_valuation_input_packs")
              .select("id,status,reviewed_by,input_hash,reviewed_at,created_at")
              .eq("company_id",item.company_id)
              .eq("status","reviewed")
              .eq("input_hash",valuation.input_hash)
              .limit(1)
              .maybeSingle();
            if(error)throw error;
            reviewedPack=data;
            if(reviewedPack?.reviewed_by!=="autonomous-policy:"+valuation.policy_version){
              throw new Error("Applied valuation did not publish the matching autonomous reviewed valuation pack.");
            }
          }

          const industryReused=industry.autonomous_run_id!==process.env.AUTONOMOUS_FACTORY_RUN_ID;
          const valuationReused=valuation.autonomous_run_id!==process.env.AUTONOMOUS_FACTORY_RUN_ID;
          const packDecisionReused=packDecision
            ?packDecision.autonomous_run_id!==process.env.AUTONOMOUS_FACTORY_RUN_ID
            :false;

          const {error:closeError}=await sb
            .from("research_factory_autonomous_runs")
            .update({
              status:"success",
              processed_count:1,
              auto_approved_count:autoApproved,
              quarantined_count:quarantined,
              summary:{
                canary:true,
                ticker:"MSFT",
                outcome:valuation.decision_status,
                industry_status:industry.decision_status,
                industry_decision_reused:industryReused,
                valuation_decision_reused:valuationReused,
                valuation_pack_decision_reused:packDecisionReused,
                valuation_policy_version:valuation.policy_version,
                valuation_confidence_pct:Number(valuation.confidence)*100,
                factory_stage:item.stage,
                factory_status:item.status,
                reviewed_valuation_pack_id:reviewedPack?.id??null
              },
              completed_at:new Date().toISOString()
            })
            .eq("id",process.env.AUTONOMOUS_FACTORY_RUN_ID);
          if(closeError)throw closeError;

          console.log(JSON.stringify({
            verified:true,
            autonomous_run_id:process.env.AUTONOMOUS_FACTORY_RUN_ID,
            ticker:item.ticker,
            factory_stage:item.stage,
            factory_status:item.status,
            coverage_pct:item.coverage_pct,
            reviewed_valuation_pack_id:reviewedPack?.id??null,
            decision_reuse:{
              industry:industryReused,
              valuation:valuationReused,
              valuation_pack:packDecisionReused
            },
            decisions:[industry,valuation,packDecision].filter(Boolean).map(x=>({
              autonomous_run_id:x.autonomous_run_id,
              decision_type:x.decision_type,
              decision_status:x.decision_status,
              confidence:x.confidence,
              policy_version:x.policy_version,
              decision_hash:x.decision_hash
            }))
          },null,2));
          NODE
