name: SOLPIENT Coverage v2

on:
  workflow_dispatch:
  schedule:
    - cron: "11 12 * * *"
  push:
    branches: [main]
    paths:
      - "lib/data-coverage-engine.mjs"
      - "scripts/build-data-coverage.mjs"
      - "scripts/test-data-coverage-engine.mjs"
      - ".github/workflows/data-coverage-v2.yml"

concurrency:
  group: solpient-coverage-v2
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Test coverage engine
        run: npm run test:coverage
      - name: Rebuild coverage for all companies
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run coverage:build
