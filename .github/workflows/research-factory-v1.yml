name: SOLPIENT Research Factory V1.1

on:
  pull_request:
    paths:
      - "lib/research-factory-v1.mjs"
      - "scripts/materialize-research-factory-v1.mjs"
      - "scripts/onboard-research-factory-v1.mjs"
      - "data/research-factory/sec-identities-pipeline-run-1.json"
      - "scripts/refresh-research-factory-v1.mjs"
      - "scripts/build-research-factory-valuation-drafts.mjs"
      - "scripts/run-research-factory-batch.mjs"
      - "scripts/test-research-factory-v1.mjs"
      - "supabase/migrations/20260922060000_research_factory_v1.sql"
      - "supabase/tests/research_factory_v1.sql"
      - "app/review/research-factory/page.tsx"
      - "app/review/research-candidates/page.tsx"
      - "docs/RESEARCH_FACTORY_V1.md"
      - "scripts/run-research-factory-expansion-v1-1.mjs"
      - "scripts/test-research-factory-v1-1.mjs"
      - "supabase/migrations/20260922123000_research_factory_v1_1_auto_expansion.sql"
      - "supabase/tests/research_factory_v1_1_auto_expansion.sql"
      - "supabase/migrations/20260922124500_research_factory_v1_1_index_cleanup.sql"
      - ".github/workflows/research-factory-v1-1-kickoff.yml"
      - ".github/workflows/research-factory-v1.yml"
  push:
    branches: [main]
    paths:
      - "lib/research-factory-v1.mjs"
      - "scripts/materialize-research-factory-v1.mjs"
      - "scripts/onboard-research-factory-v1.mjs"
      - "data/research-factory/sec-identities-pipeline-run-1.json"
      - "scripts/refresh-research-factory-v1.mjs"
      - "scripts/build-research-factory-valuation-drafts.mjs"
      - "scripts/run-research-factory-batch.mjs"
      - "scripts/test-research-factory-v1.mjs"
      - "supabase/migrations/20260922060000_research_factory_v1.sql"
      - "supabase/tests/research_factory_v1.sql"
      - "app/review/research-factory/page.tsx"
      - "app/review/research-candidates/page.tsx"
      - "docs/RESEARCH_FACTORY_V1.md"
      - "scripts/run-research-factory-expansion-v1-1.mjs"
      - "scripts/test-research-factory-v1-1.mjs"
      - "supabase/migrations/20260922123000_research_factory_v1_1_auto_expansion.sql"
      - "supabase/tests/research_factory_v1_1_auto_expansion.sql"
      - "supabase/migrations/20260922124500_research_factory_v1_1_index_cleanup.sql"
      - ".github/workflows/research-factory-v1-1-kickoff.yml"
      - ".github/workflows/research-factory-v1.yml"
  workflow_dispatch:
    inputs:
      max_companies:
        description: "Maximum automatic candidates to process"
        required: false
        default: "10"
        type: string
      ticker:
        description: "Optional single ticker"
        required: false
        type: string
  schedule:
    - cron: "29 14 * * 1-5"

concurrency:
  group: solpient-research-factory-v1
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Test Research Factory V1
        run: |
          npm run test:research-factory
          npm run test:research-factory:v1.1
      - name: Syntax check Research Factory scripts
        run: |
          node --check scripts/materialize-research-factory-v1.mjs
          node --check scripts/onboard-research-factory-v1.mjs
          node --check scripts/refresh-research-factory-v1.mjs
          node --check scripts/build-research-factory-valuation-drafts.mjs
          node --check scripts/run-research-factory-batch.mjs
          node --check scripts/run-research-factory-expansion-v1-1.mjs

  operate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEARCH_FACTORY_MAX_COMPANIES: ${{ github.event.inputs.max_companies || '10' }}
      RESEARCH_FACTORY_TICKER: ${{ github.event.inputs.ticker || '' }}
      RESEARCH_FACTORY_SEC_IDENTITY_SNAPSHOT: "data/research-factory/sec-identities-pipeline-run-1.json"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Expand the next safe Research Factory batch
        run: |
          if [ -n "$RESEARCH_FACTORY_TICKER" ]; then
            node scripts/run-research-factory-expansion-v1-1.mjs --ticker="$RESEARCH_FACTORY_TICKER" --max=1
          else
            node scripts/run-research-factory-expansion-v1-1.mjs --max="$RESEARCH_FACTORY_MAX_COMPANIES"
          fi
