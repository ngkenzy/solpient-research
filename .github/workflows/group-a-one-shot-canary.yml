name: Group A One-Shot Production Canary

on:
  push:
    branches:
      - ops/group-a-production-closeout

concurrency:
  group: group-a-one-shot-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SEC_CONTACT: "ngkenzy@users.noreply.github.com"
      SEC_USER_AGENT: "SOLPIENT Research ngkenzy@users.noreply.github.com"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/group-a-production-closeout

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Production health before canary
        run: npm run check:research-foundation:production

      - name: SEC monitor canary
        run: node scripts/monitor-sec.mjs

      - name: Persist SEC canary state
        run: npm run sync:sec-monitor-state

      - name: Refresh market observations
        env:
          MARKET_DATA_USER_AGENT: "SOLPIENT Research/1.0"
        run: node scripts/sync-market-data.mjs

      - name: Recompute Group A foundation state
        run: npm run sync:research-foundation

      - name: Run targeted maintenance canary
        env:
          RESEARCH_MAINTENANCE_BATCH_SIZE: "5"
        run: npm run process:research-maintenance

      - name: Production health after canary
        run: npm run check:research-foundation:production

      - name: Capture final production state
        env:
          GROUP_A_PHASE: post
          GROUP_A_STATE_OUTPUT: group-a-production-post-canary.json
        run: node scripts/group-a-production-state.mjs

      - name: Upload canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: group-a-one-shot-canary-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            group-a-production-post-canary.json
            data/monitor/sec-state.json
            data/monitor/sec-events.json
