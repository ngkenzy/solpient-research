name: SOLPIENT Daily Intelligence
# provider verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/auto-intelligence.yml"
  schedule:
    - cron: "20 1 * * 1-6"
  workflow_dispatch:

concurrency:
  group: solpient-daily-intelligence
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Refresh fundamentals and filings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: node scripts/sync-fmp-data.mjs

      - name: Refresh end-of-day market snapshots
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MARKET_DATA_USER_AGENT: "SOLPIENT Research/1.0"
        run: node scripts/sync-market-data.mjs

      - name: Evaluate matured predictions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/evaluate-predictions.mjs
