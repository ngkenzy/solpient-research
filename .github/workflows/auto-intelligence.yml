name: SOLPIENT Daily Intelligence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/auto-intelligence.yml"
  schedule:
    - cron: "20 1 * * 1-6"
  workflow_dispatch:

concurrency:
  group: solpient-daily-intelligence
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Refresh SEC fundamentals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl --fail-with-body --retry 2 --retry-delay 2 \
            -X POST "${SUPABASE_URL}/functions/v1/sec-fundamentals-sync" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}'

      - name: Refresh end-of-day market snapshots
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MARKET_DATA_USER_AGENT: "SOLPIENT Research/1.0"
        run: node scripts/sync-market-data.mjs

      - name: Evaluate matured predictions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/evaluate-predictions.mjs
