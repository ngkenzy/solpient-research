name: Legacy research validation

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Test research engines
        run: |
          npm run test:changes
          npm run test:standard
          npm run test:standard:v2

      - name: Validate legacy research files without publishing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -d "data/research" ]; then
            find data/research -type f -name '*.json' ! -name '*.template.json' -print0 | sort -z | while IFS= read -r -d '' file; do
              node scripts/import-research.mjs "$file"
            done
          fi

      - name: Explain publication boundary
        run: |
          echo "Legacy JSON import is validation-only."
          echo "Normal publication must use Evidence -> Draft -> Context -> Composition -> Human Review -> Validation -> publish_reviewed_research_v2()."
