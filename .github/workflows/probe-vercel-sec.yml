name: Probe Vercel SEC access

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-vercel-sec.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Call deployed SEC probe
        run: |
          curl --fail-with-body --silent --show-error             https://solpient-research-app.vercel.app/api/sec-probe
