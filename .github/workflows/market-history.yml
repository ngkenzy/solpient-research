name: Market History Refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/sync-market-history.mjs"
      - ".github/workflows/market-history.yml"

concurrency:
  group: market-history-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Refresh company and benchmark market history
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync:market-history
