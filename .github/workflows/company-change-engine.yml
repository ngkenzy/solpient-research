name: SOLPIENT Company Change Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"
  push:
    branches: [main]
    paths:
      - "lib/company-change-engine.mjs"
      - "scripts/build-company-change-events.mjs"
      - "scripts/backfill-research-change-events.mjs"
      - ".github/workflows/company-change-engine.yml"

concurrency:
  group: solpient-company-change-engine
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Test change rules
        run: npm run test:company-change
      - name: Backfill published research-version changes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run changes:backfill
      - name: Capture current company states
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run changes:capture
