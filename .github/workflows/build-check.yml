name: SOLPIENT Build Check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: solpient-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Test research engines
        run: |
          npm run test:changes
          npm run test:company-change
          npm run test:decision-triggers
          npm run test:standard
          npm run test:standard:v2
          npm run test:factory
          npm run test:review
          npm run test:review-attestation
          npm run test:enrichment
          npm run test:update-planner
          npm run test:context
          npm run test:coverage
          npm run test:composer
          npm run test:capital-intelligence
          npm run test:capital-orchestrator
          npm run test:capital-coverage
          npm run test:yahoo-capital
          npm run test:quiver-political
          npm run test:marketbeat-capital
          npm run test:integrity
          npm run test:publication-integrity
          npm run test:provenance
          npm run test:universe-sector:v2
          npm run test:sector-evidence:v2.1
          npm run test:sector-classification:v2.2
          npm run test:sector-classification:v2.3
          npm run test:methodology
          npm run test:methodology-activation
          npm run test:candidate-pipeline:v2.4
          npm run test:research-factory
          npm run test:research-factory:v1.1
          npm run test:screen-publish
          npm run test:lists
          npm run test:data-engine
          npm run test:local-update
          npm run local:daily:dry-run
          npm run local:governed:plan

      - name: Check repair center scripts
        run: |
          node --check scripts/build-research-repair-queue.mjs
          node --check scripts/process-research-repairs.mjs
          node --check scripts/sync-evidence-provenance.mjs
          node --check scripts/materialize-research-factory-v1.mjs
          node --check scripts/onboard-research-factory-v1.mjs
          node --check scripts/refresh-research-factory-v1.mjs
          node --check scripts/build-research-factory-valuation-drafts.mjs
          node --check scripts/run-research-factory-batch.mjs
          node --check scripts/run-research-factory-expansion-v1-1.mjs
          node --check scripts/refresh-solpient-lists.mjs
          node --check scripts/run-solpient-daily.mjs
          node --check scripts/install-solpient-daily-launchd.mjs
          node --check scripts/with-pipeline-lock.mjs
          node --check scripts/run-solpient-governed.mjs
          node --check scripts/refresh-rankings.mjs
          node --check scripts/sync-market-history.mjs

      - name: Build Next.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build
