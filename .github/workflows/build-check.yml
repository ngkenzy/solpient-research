name: SOLPIENT Build Check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: solpient-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Test research engines
        run: |
          npm run test:changes
          npm run test:standard
          npm run test:standard:v2
          npm run test:factory
          npm run test:review
          npm run test:enrichment
          npm run test:update-planner
          npm run test:context
          npm run test:coverage
          npm run test:composer
          npm run test:capital-intelligence
          npm run test:capital-orchestrator
          npm run test:capital-coverage
          npm run test:yahoo-capital

      - name: Build Next.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build
