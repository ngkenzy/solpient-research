name: SOLPIENT Research Update Planner
on:
  workflow_dispatch:
concurrency:
  group: solpient-research-update-planner
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test:update-planner
      - name: Plan updates for tracked companies
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p artifacts/update-plans
          npm run plan:updates -- --output artifacts/update-plans/latest.json
      - uses: actions/upload-artifact@v4
        with:
          name: research-update-plan
          path: artifacts/update-plans/latest.json
          if-no-files-found: error
          retention-days: 30
