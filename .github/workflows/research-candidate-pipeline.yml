name: Research Candidate Pipeline

on:
  pull_request:
    paths:
      - "lib/universe-screening-engine.mjs"
      - "lib/universe-sector-model-v2.mjs"
      - "lib/universe-sector-model-v2-2.mjs"
      - "lib/universe-sector-model-v2-3.mjs"
      - "lib/sector-evidence-model-v2-1.mjs"
      - "lib/universe-screening-engine-v2.mjs"
      - "lib/universe-screening-engine-v2-1.mjs"
      - "lib/universe-screening-engine-v2-2.mjs"
      - "lib/research-candidate-pipeline-v2.mjs"
      - "lib/research-candidate-pipeline-v2-1.mjs"
      - "lib/research-candidate-pipeline-v2-2.mjs"
      - "lib/research-candidate-pipeline.mjs"
      - "lib/research-candidate-materialization-v1.mjs"
      - "lib/research-candidate-pipeline-v2-4.mjs"
      - "lib/methodology-activation-v1.mjs"
      - "lib/methodology-implementation-hash.mjs"
      - "lib/valuation-engine-v3.mjs"
      - "scripts/test-universe-screening-engine.mjs"
      - "scripts/test-universe-sector-model-v2.mjs"
      - "scripts/test-sector-evidence-model-v2-1.mjs"
      - "scripts/test-sector-classification-repair-v2-2.mjs"
      - "scripts/test-sector-classification-coverage-v2-3.mjs"
      - "scripts/fixtures/sector-classification-v2-3-audit.json"
      - "scripts/test-research-candidate-pipeline.mjs"
      - "scripts/materialize-research-candidate-pipeline.mjs"
      - "scripts/test-methodology-activation-v1.mjs"
      - "scripts/register-candidate-valuation-input.mjs"
      - "supabase/migrations/20260921223000_solpient_100_universe_screening.sql"
      - "supabase/migrations/20260921224000_research_candidate_pipeline.sql"
      - "supabase/tests/universe_screening.sql"
      - "supabase/tests/research_candidate_pipeline.sql"
      - "supabase/migrations/20260922032500_methodology_activation_v1_1_hardening.sql"
      - "supabase/tests/methodology_activation_v1_1.sql"
      - "app/review/universe-screening/page.tsx"
      - "app/review/research-candidates/page.tsx"
      - "scripts/test-research-candidate-pipeline-v2-4.mjs"
      - "scripts/materialize-research-candidate-pipeline-v2-4.mjs"
      - "supabase/migrations/20260922050000_research_candidate_pipeline_v2_4_integrity.sql"
      - "supabase/tests/research_candidate_pipeline_v2_4.sql"
      - "docs/RESEARCH_CANDIDATE_PIPELINE_V2_4.md"
      - "methodologies/catalog.json"
      - "scripts/print-methodology-fingerprint.mjs"
      - ".github/workflows/research-candidate-pipeline.yml"
  push:
    branches: [main]
    paths:
      - "lib/methodology-activation-v1.mjs"
      - "lib/methodology-implementation-hash.mjs"
      - "lib/universe-screening-engine.mjs"
      - "lib/research-candidate-pipeline.mjs"
      - "scripts/test-methodology-activation-v1.mjs"
      - "scripts/validate-activate-universe-methodologies.mjs"
      - "scripts/run-universe-screen.mjs"
      - "scripts/materialize-research-candidate-pipeline.mjs"
      - "supabase/migrations/20260922032500_methodology_activation_v1_1_hardening.sql"
      - "supabase/tests/methodology_activation_v1_1.sql"
      - "lib/research-candidate-pipeline-v2-4.mjs"
      - "lib/research-candidate-materialization-v1.mjs"
      - "scripts/test-research-candidate-pipeline-v2-4.mjs"
      - "scripts/materialize-research-candidate-pipeline-v2-4.mjs"
      - "scripts/print-methodology-fingerprint.mjs"
      - "supabase/migrations/20260922050000_research_candidate_pipeline_v2_4_integrity.sql"
      - "supabase/tests/research_candidate_pipeline_v2_4.sql"
      - "docs/RESEARCH_CANDIDATE_PIPELINE_V2_4.md"
      - "methodologies/catalog.json"
      - ".github/workflows/research-candidate-pipeline.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Test universe screening
        run: node scripts/test-universe-screening-engine.mjs
      - name: Test Sector Model V2
        run: node scripts/test-universe-sector-model-v2.mjs
      - name: Test Sector Evidence Model V2.1
        run: node scripts/test-sector-evidence-model-v2-1.mjs
      - name: Test Sector Classification Repair V2.2
        run: node scripts/test-sector-classification-repair-v2-2.mjs
      - name: Test Sector Classification Coverage V2.3
        run: node scripts/test-sector-classification-coverage-v2-3.mjs
      - name: Audit V2.3 taxonomy coverage
        run: node scripts/audit-sector-classification.mjs --input=scripts/fixtures/sector-classification-v2-3-audit.json --fail-on-obvious-unknown=true --fail-on-unresolved=true
      - name: Test candidate handoff
        run: node scripts/test-research-candidate-pipeline.mjs
      - name: Test candidate V2.4 integrity
        run: node scripts/test-research-candidate-pipeline-v2-4.mjs
      - name: Fingerprint candidate V2.4 methodology
        run: node scripts/print-methodology-fingerprint.mjs --key=research_candidate_pipeline --version=research-candidate-pipeline-v2.4
      - name: Test Methodology Activation V1
        run: node scripts/test-methodology-activation-v1.mjs
      - name: Syntax check materializers
        run: |
          node --check scripts/run-universe-screen.mjs
          node --check scripts/materialize-research-candidate-pipeline.mjs
          node --check scripts/materialize-research-candidate-pipeline-v2-4.mjs
          node --check scripts/register-candidate-valuation-input.mjs
