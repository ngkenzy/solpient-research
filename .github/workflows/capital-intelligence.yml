name: Capital Intelligence Orchestrator

on:
  workflow_dispatch:
  schedule:
    - cron: "23 12 * * 1-5"
  push:
    branches: [main]
    paths:
      - "lib/capital-intelligence-engine.mjs"
      - "lib/capital-intelligence-orchestrator.mjs"
      - "lib/yahoo-capital-intelligence.mjs"
      - "lib/quiver-political-intelligence.mjs"
      - "lib/marketbeat-capital-intelligence.mjs"
      - "scripts/sync-marketbeat-capital-intelligence.mjs"
      - "scripts/test-marketbeat-capital-intelligence.mjs"
      - "scripts/sync-quiver-political-intelligence.mjs"
      - "scripts/test-quiver-political-intelligence.mjs"
      - "scripts/sync-yahoo-capital-intelligence.mjs"
      - "scripts/test-yahoo-capital-intelligence.mjs"
      - "scripts/test-capital-coverage-verification.mjs"
      - "scripts/export-pending-capital-coverage.mjs"
      - "scripts/import-capital-coverage-batch.mjs"
      - "scripts/sync-capital-intelligence.mjs"
      - "scripts/audit-capital-intelligence.mjs"
      - "scripts/import-capital-intelligence-batch.mjs"
      - "scripts/test-capital-intelligence-engine.mjs"
      - "scripts/test-capital-intelligence-orchestrator.mjs"
      - "data/monitor/companies.json"
      - "data/monitor/managers.json"
      - "data/monitor/capital-providers.json"
      - ".github/workflows/capital-intelligence.yml"

concurrency:
  group: capital-intelligence-orchestrator
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Test capital intelligence
        run: |
          npm run test:capital-intelligence
          npm run test:capital-orchestrator
          npm run test:capital-coverage
          npm run test:yahoo-capital
          npm run test:quiver-political
          npm run test:marketbeat-capital
      - name: Refresh Quiver political fallback
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync:quiver-political
      - name: Refresh MarketBeat capital fallback
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync:marketbeat-capital
      - name: Try direct SEC adapter
        id: direct_sec
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEC_USER_AGENT: "SOLPIENT Research ngkenzy@users.noreply.github.com"
          SEC_CONTACT: "ngkenzy@users.noreply.github.com"
        run: npm run sync:capital-intelligence
      - name: Audit provider health and coverage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run audit:capital-intelligence
      - name: Normalize intelligence events
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-intelligence-events.mjs
