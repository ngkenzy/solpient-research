name: Consensus Snapshot Refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/sync-marketbeat-consensus.mjs"
      - ".github/workflows/consensus-snapshots.yml"

concurrency:
  group: consensus-snapshot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Capture point-in-time consensus snapshots
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-marketbeat-consensus.mjs
