<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Solpient</title>
  <desc id="desc">A rising research mark with a blue S ribbon, ascending bars, and gold spark.</desc>
  <defs>
    <linearGradient id="ribbon" x1="38" y1="40" x2="206" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18d8e2"/>
      <stop offset=".34" stop-color="#0875bf"/>
      <stop offset=".72" stop-color="#083f7a"/>
      <stop offset="1" stop-color="#052a53"/>
    </linearGradient>
    <linearGradient id="cyanBar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20dfe3"/>
      <stop offset="1" stop-color="#087aa2"/>
    </linearGradient>
    <linearGradient id="goldBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe17a"/>
      <stop offset=".55" stop-color="#e9aa23"/>
      <stop offset="1" stop-color="#a96a08"/>
    </linearGradient>
    <linearGradient id="goldSpark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff5b0"/>
      <stop offset=".48" stop-color="#ffd54c"/>
      <stop offset="1" stop-color="#c9870c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".32"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <path d="M44 82C70 42 117 25 168 28c-19 22-43 37-72 50-21 10-33 23-35 39-3 26 20 41 58 55 43 16 65 36 64 62-1 26-24 44-60 53 27-18 39-36 34-53-5-17-23-27-55-39-50-18-76-43-76-77 0-13 6-25 18-36Z" fill="url(#ribbon)"/>
    <path d="M51 85c23-31 61-47 109-51-19 17-40 30-65 42-28 13-43 30-45 49-1 10 2 20 8 29-18-18-21-42-7-69Z" fill="#1bdbe2" opacity=".46"/>
    <path d="M78 218c27-19 54-24 83-39 11 8 18 17 21 27-20 17-50 27-92 31Z" fill="#16d4dd" opacity=".72"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M111 118h24v38h-24z" fill="url(#cyanBar)"/>
    <path d="M145 93h27v75h-27z" fill="url(#cyanBar)"/>
    <path d="M181 64h29v118h-29z" fill="url(#goldBar)"/>
    <path d="M211 21c4 17 12 25 29 29-17 4-25 12-29 29-4-17-12-25-29-29 17-4 25-12 29-29Z" fill="url(#goldSpark)"/>
  </g>
</svg>